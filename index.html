<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blocky v1.8 Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2e;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2b2b3d;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    h1 { margin: 0; font-size: 20px; color: #ffbf00; }
    .btn {
      background: #4c97ff;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-green { background: #4bc02f; }
    .btn-purple { background: #9966ff; }
    .btn-red { background: #ff4c4c; }
    
    .auth-container input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #181825;
      color: white;
    }

    main {
      display: flex;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      background: #2b2b3d;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    #sidebar { width: 220px; gap: 10px; }
    #blocks-palette { width: 200px; gap: 8px; overflow-y: auto; }
    #editor { flex: 1; position: relative; background: #181825; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
    #stage-panel { width: 320px; align-items: center; }

    /* BLOCK STYLES */
    .code-block {
      background: #4c97ff;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .code-block input {
      width: 40px;
      padding: 2px 4px;
      border-radius: 3px;
      border: none;
      text-align: center;
      font-weight: bold;
    }
    .block-purple { background: #9966ff; }
    .block-green { background: #4bc02f; }

    #workspace-stack {
      flex: 1;
      border: 2px dashed #3b3b54;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    #stage {
      width: 300px;
      height: 300px;
      background: #ffffff;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .sprite {
      width: 40px;
      height: 40px;
      position: absolute;
      top: 130px;
      left: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      user-select: none;
      transition: all 0.2s ease;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: #2b2b3d;
      border: 2px solid #ffbf00;
      border-radius: 10px;
      padding: 20px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-card input {
      padding: 8px;
      background: #181825;
      border: 1px solid #444;
      color: white;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧩 Blocky v1.8 Studio</h1>
    <div class="auth-container" id="auth-box">
      <input type="text" id="auth-username" placeholder="Username">
      <input type="password" id="auth-password" placeholder="Password">
      <button class="btn btn-green" onclick="handleAuth('login')">Log In</button>
      <button class="btn" onclick="handleAuth('signup')">Sign Up</button>
    </div>
    <div id="user-box" style="display:none;">
      <span id="user-display" style="margin-right:10px; font-weight:bold; color:#ffbf00;"></span>
      <button class="btn btn-red" onclick="handleLogout()">Log Out</button>
    </div>
  </header>

  <main>
    <!-- Left Sidebar: Tools & Saving -->
    <div class="panel" id="sidebar">
      <h3>📁 Tools</h3>
      <button class="btn btn-green" id="btn-save-game">💾 Save Game</button>
      <button class="btn btn-purple" id="btn-publish-game">🚀 Publish Hub</button>
      <hr style="width:100%; border:1px solid #3b3b54;">
      <input type="text" id="load-id-input" placeholder="Game ID..." style="padding:8px; background:#181825; border:1px solid #444; color:white; border-radius:4px; width:100%;">
      <button class="btn" id="btn-load-game">📥 Load Game</button>
      <button class="btn btn-red" style="margin-top:auto;" onclick="clearWorkspace()">🗑️ Clear Code</button>
    </div>

    <!-- Blocks Toolbox -->
    <div class="panel" id="blocks-palette">
      <h3 style="font-size:14px; margin-top:0;">🧩 Blocks</h3>
      <div class="code-block" onclick="addBlockToWorkspace('move_right', 20)">➡️ Move Right <input type="number" value="20" onclick="event.stopPropagation()"></div>
      <div class="code-block" onclick="addBlockToWorkspace('move_left', 20)">⬅️ Move Left <input type="number" value="20" onclick="event.stopPropagation()"></div>
      <div class="code-block" onclick="addBlockToWorkspace('move_up', 20)">⬆️ Move Up <input type="number" value="20" onclick="event.stopPropagation()"></div>
      <div class="code-block" onclick="addBlockToWorkspace('move_down', 20)">⬇️ Move Down <input type="number" value="20" onclick="event.stopPropagation()"></div>
      <div class="code-block block-purple" onclick="addBlockToWorkspace('say_msg', 'Hello!')">💬 Say <input type="text" value="Hello!" style="width:60px;" onclick="event.stopPropagation()"></div>
      <div class="code-block block-green" onclick="addBlockToWorkspace('reset_pos', 0)">🔄 Reset Position</div>
    </div>

    <!-- Script Workspace -->
    <div class="panel" id="editor">
      <h3 style="margin-top:0;">💻 Script Workspace (Click blocks on left to add)</h3>
      <div id="workspace-stack"></div>
    </div>

    <!-- Stage Display -->
    <div class="panel" id="stage-panel">
      <h3>🎮 Stage</h3>
      <div id="stage">
        <div class="sprite" id="player-sprite">🐱</div>
        <div id="speech-bubble" style="display:none; position:absolute; top:90px; left:120px; background:white; color:black; padding:5px 10px; border-radius:8px; font-size:12px; font-weight:bold; border:1px solid black;">Hello!</div>
      </div>
      <button class="btn btn-green" style="width:100%;" onclick="runScript()">▶️ Run Script</button>
    </div>
  </main>

  <!-- PUBLISH MODAL -->
  <div class="modal-overlay" id="publish-modal">
    <div class="modal-card">
      <h3 style="margin:0; color:#ffbf00; text-align:center;">Publish to Community Hub</h3>
      <label style="font-size:12px;">Give your creation a title:</label>
      <input type="text" id="publish-title" placeholder="e.g. Walking Cat Adventure">
      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <button class="btn btn-red" onclick="closePublishModal()">Cancel</button>
        <button class="btn btn-green" onclick="submitPublish()">Publish Now!</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ohojsqpbjmhkjppxoccd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ob2pzcXBiam1oa2pwcHhvY2NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDIwNjYsImV4cCI6MjEwMTExODA2Nn0.S7DCqf7gJQpVfWk8ELGCpX3_NLn36o24TKhOTyMxyNs';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let loggedUser = null;
    let currentSavedID = null;
    let activeScript = [];

    // --- AUTHENTICATION ---
    async function handleAuth(type) {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();

      if (!u || !p) return alert("Please enter both username and password!");

      if (type === 'signup') {
        const { error } = await db.from('profiles').insert([{ username: u, password: p }]);
        if (error) return alert("Sign Up failed: " + error.message);
        alert("Account created! Logging you in...");
        loginUser(u);
      } else {
        const { data, error } = await db.from('profiles').select('*').eq('username', u).eq('password', p);
        if (error || !data || data.length === 0) return alert("Login failed: Incorrect credentials.");
        
        if (data[0].is_banned) {
          return alert("⛔ ACCOUNT BANNED: Your account has been suspended by an admin.");
        }
        loginUser(data[0].username);
      }
    }

    function loginUser(username) {
      loggedUser = username;
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('user-box').style.display = 'block';
      document.getElementById('user-display').textContent = '👤 ' + username;
    }

    function handleLogout() {
      loggedUser = null;
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('user-box').style.display = 'none';
    }

    // --- BLOCK WORKSPACE LOGIC ---
    function addBlockToWorkspace(type, defaultVal) {
      const id = Date.now() + Math.random();
      activeScript.push({ id, type, val: defaultVal });
      renderWorkspace();
    }

    function removeBlock(id) {
      activeScript = activeScript.filter(b => b.id !== id);
      renderWorkspace();
    }

    function clearWorkspace() {
      activeScript = [];
      renderWorkspace();
    }

    function renderWorkspace() {
      const container = document.getElementById('workspace-stack');
      container.innerHTML = '';

      if (activeScript.length === 0) {
        container.innerHTML = '<div style="color:#aaa; text-align:center; margin-top:20px;">Click blocks on the left palette to add them here!</div>';
        return;
      }

      activeScript.forEach((block, idx) => {
        const div = document.createElement('div');
        let blockClass = 'code-block';
        if (block.type === 'say_msg') blockClass += ' block-purple';
        if (block.type === 'reset_pos') blockClass += ' block-green';

        div.className = blockClass;
        div.style.justifyContent = 'space-between';

        let label = '';
        if (block.type === 'move_right') label = `➡️ Move Right`;
        else if (block.type === 'move_left') label = `⬅️ Move Left`;
        else if (block.type === 'move_up') label = `⬆️ Move Up`;
        else if (block.type === 'move_down') label = `⬇️ Move Down`;
        else if (block.type === 'say_msg') label = `💬 Say`;
        else if (block.type === 'reset_pos') label = `🔄 Reset Position`;

        let inputHtml = block.type !== 'reset_pos' ? `<input type="${block.type === 'say_msg' ? 'text' : 'number'}" value="${block.val}" onchange="updateBlockValue(${block.id}, this.value)">` : '';

        div.innerHTML = `
          <span>${label} ${inputHtml}</span>
          <span style="color:#ff4c4c; cursor:pointer;" onclick="removeBlock(${block.id})">✖</span>
        `;
        container.appendChild(div);
      });
    }

    function updateBlockValue(id, newVal) {
      const target = activeScript.find(b => b.id === id);
      if (target) target.val = newVal;
    }

    // --- RUN SCRIPT ON STAGE ---
    async function runScript() {
      const sprite = document.getElementById('player-sprite');
      const bubble = document.getElementById('speech-bubble');
      bubble.style.display = 'none';

      let posX = parseInt(sprite.style.left || 130);
      let posY = parseInt(sprite.style.top || 130);

      for (let block of activeScript) {
        const val = parseInt(block.val) || block.val;

        if (block.type === 'move_right') posX += val;
        else if (block.type === 'move_left') posX -= val;
        else if (block.type === 'move_down') posY += val;
        else if (block.type === 'move_up') posY -= val;
        else if (block.type === 'reset_pos') { posX = 130; posY = 130; }
        else if (block.type === 'say_msg') {
          bubble.textContent = block.val;
          bubble.style.left = (posX - 10) + 'px';
          bubble.style.top = (posY - 35) + 'px';
          bubble.style.display = 'block';
        }

        sprite.style.left = posX + 'px';
        sprite.style.top = posY + 'px';

        await new Promise(r => setTimeout(r, 300));
      }
    }

    // --- SAVE / LOAD / PUBLISH ---
    function generateID(len = 8) {
      return Math.random().toString(36).substring(2, 2 + len).toUpperCase();
    }

    document.getElementById('btn-save-game').addEventListener('click', async () => {
      const gameID = generateID();
      currentSavedID = gameID;

      const gameData = {
        script: activeScript,
        author: loggedUser || 'Anonymous'
      };

      localStorage.setItem(`blocky_${gameID}`, JSON.stringify(gameData));
      await db.from('projects').insert([{ id: gameID, data: gameData }]);

      alert(`✅ Game Saved! Your Game ID is: ${gameID}`);
    });

    document.getElementById('btn-load-game').addEventListener('click', async () => {
      const id = document.getElementById('load-id-input').value.trim().toUpperCase();
      if (!id) return alert("Please enter a Game ID!");

      const { data, error } = await db.from('projects').select('*').eq('id', id);
      if (data && data.length > 0) {
        activeScript = data[0].data.script || [];
        renderWorkspace();
        alert(`🎉 Game '${id}' loaded! Created by ${data[0].data.author}`);
      } else {
        alert("Game ID not found!");
      }
    });

    document.getElementById('btn-publish-game').addEventListener('click', () => {
      if (!loggedUser) return alert("You must log in to publish games to the Community Hub!");
      if (!currentSavedID) currentSavedID = generateID();
      document.getElementById('publish-modal').style.display = 'flex';
    });

    function closePublishModal() {
      document.getElementById('publish-modal').style.display = 'none';
    }

    async function submitPublish() {
      const title = document.getElementById('publish-title').value.trim();
      if (!title) return alert("Please give your game a title!");

      const { error } = await db.from('published_games').insert([{
        title: title,
        game_id: currentSavedID,
        author: loggedUser
      }]);

      if (!error) {
        alert(`🚀 '${title}' published to Community Hub!\nID: ${currentSavedID}`);
        closePublishModal();
        document.getElementById('publish-title').value = '';
      } else {
        alert("Publishing failed: " + error.message);
      }
    }
  </script>
</body>
</html>

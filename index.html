<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blocky v1.7 Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2e;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2b2b3d;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    h1 { margin: 0; font-size: 20px; color: #ffbf00; }
    .btn {
      background: #4c97ff;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-green { background: #4bc02f; }
    .btn-purple { background: #9966ff; }
    .btn-red { background: #ff4c4c; }
    
    .auth-container input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #181825;
      color: white;
    }

    main {
      display: flex;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      background: #2b2b3d;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    #sidebar { width: 250px; gap: 10px; }
    #editor { flex: 1; position: relative; }
    #stage-panel { width: 320px; align-items: center; }

    #stage {
      width: 300px;
      height: 300px;
      background: #ffffff;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .sprite {
      width: 40px;
      height: 40px;
      position: absolute;
      top: 130px;
      left: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      user-select: none;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: #2b2b3d;
      border: 2px solid #ffbf00;
      border-radius: 10px;
      padding: 20px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-card input {
      padding: 8px;
      background: #181825;
      border: 1px solid #444;
      color: white;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧩 Blocky v1.7 Studio</h1>
    <div class="auth-container" id="auth-box">
      <input type="text" id="auth-username" placeholder="Username">
      <input type="password" id="auth-password" placeholder="Password">
      <button class="btn btn-green" onclick="handleAuth('login')">Log In</button>
      <button class="btn" onclick="handleAuth('signup')">Sign Up</button>
    </div>
    <div id="user-box" style="display:none;">
      <span id="user-display" style="margin-right:10px; font-weight:bold; color:#ffbf00;"></span>
      <button class="btn btn-red" onclick="handleLogout()">Log Out</button>
    </div>
  </header>

  <main>
    <!-- Left Sidebar: Controls & Game Saving -->
    <div class="panel" id="sidebar">
      <h3>📁 Project Tools</h3>
      <button class="btn btn-green" id="btn-save-game">💾 Save Game</button>
      <button class="btn btn-purple" id="btn-publish-game">🚀 Publish to Hub</button>
      <hr style="width:100%; border:1px solid #3b3b54;">
      <input type="text" id="load-id-input" placeholder="Enter Game ID..." style="padding:8px; background:#181825; border:1px solid #444; color:white; border-radius:4px;">
      <button class="btn" id="btn-load-game">📥 Load Game</button>
    </div>

    <!-- Center: Coding Workspace -->
    <div class="panel" id="editor">
      <h3>💻 Script Workspace</h3>
      <p style="color:#aaa; font-size:13px;">Drag/configure your blocks here (v1.7 logic active)</p>
    </div>

    <!-- Right: Stage Display -->
    <div class="panel" id="stage-panel">
      <h3>🎮 Stage</h3>
      <div id="stage">
        <div class="sprite" id="player-sprite">🐱</div>
      </div>
      <button class="btn btn-green" style="width:100%;" onclick="alert('Running Game Script...')">▶️ Run Project</button>
    </div>
  </main>

  <!-- PUBLISH MODAL POPUP -->
  <div class="modal-overlay" id="publish-modal">
    <div class="modal-card">
      <h3 style="margin:0; color:#ffbf00; text-align:center;">Publish to Community Hub</h3>
      <label style="font-size:12px;">Give your creation a title:</label>
      <input type="text" id="publish-title" placeholder="e.g. Super Cat Adventure">
      <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <button class="btn btn-red" onclick="closePublishModal()">Cancel</button>
        <button class="btn btn-green" onclick="submitPublish()">Publish Now!</button>
      </div>
    </div>
  </div>

  <script>
    // SUPABASE SETUP
    const SUPABASE_URL = 'https://ohojsqpbjmhkjppxoccd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ob2pzcXBiam1oa2pwcHhvY2NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDIwNjYsImV4cCI6MjEwMTExODA2Nn0.S7DCqf7gJQpVfWk8ELGCpX3_NLn36o24TKhOTyMxyNs';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let loggedUser = null;
    let currentSavedID = null;

    // --- AUTHENTICATION SYSTEM ---
    async function handleAuth(type) {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();

      if (!u || !p) return alert("Please fill in both username and password!");

      if (type === 'signup') {
        const { error } = await db.from('profiles').insert([{ username: u, password: p }]);
        if (error) return alert("Sign Up failed: " + error.message);
        alert("Account created successfully! Logging you in...");
        loginUser(u);
      } else {
        const { data, error } = await db.from('profiles').select('*').eq('username', u).eq('password', p);
        if (error || !data || data.length === 0) return alert("Login failed: Incorrect credentials.");
        
        const user = data[0];
        if (user.is_banned) {
          return alert("⛔ ACCOUNT BANNED: Your account has been suspended by an admin.");
        }
        loginUser(user.username);
      }
    }

    function loginUser(username) {
      loggedUser = username;
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('user-box').style.display = 'block';
      document.getElementById('user-display').textContent = '👤 ' + username;
    }

    function handleLogout() {
      loggedUser = null;
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('user-box').style.display = 'none';
    }

    // --- SAVE & LOAD SYSTEM ---
    function generateID(len = 8) {
      return Math.random().toString(36).substring(2, 2 + len).toUpperCase();
    }

    document.getElementById('btn-save-game').addEventListener('click', async () => {
      const gameID = generateID();
      currentSavedID = gameID;

      const gameData = {
        sprite: '🐱',
        stageBg: '#ffffff',
        author: loggedUser || 'Anonymous'
      };

      // Save locally & to Database
      localStorage.setItem(`blocky_${gameID}`, JSON.stringify(gameData));
      await db.from('projects').insert([{ id: gameID, data: gameData }]);

      alert(`✅ Game Saved! Your Game ID is: ${gameID}`);
    });

    document.getElementById('btn-load-game').addEventListener('click', async () => {
      const id = document.getElementById('load-id-input').value.trim().toUpperCase();
      if (!id) return alert("Please enter a Game ID!");

      const { data, error } = await db.from('projects').select('*').eq('id', id);
      if (data && data.length > 0) {
        alert(`🎉 Game '${id}' loaded successfully! Created by ${data[0].data.author}`);
      } else {
        alert("Game ID not found!");
      }
    });

    // --- COMMUNITY HUB PUBLISH SYSTEM ---
    document.getElementById('btn-publish-game').addEventListener('click', () => {
      if (!loggedUser) return alert("You must log in to publish games to the Community Hub!");
      if (!currentSavedID) {
        currentSavedID = generateID();
      }
      document.getElementById('publish-modal').style.display = 'flex';
    });

    function closePublishModal() {
      document.getElementById('publish-modal').style.display = 'none';
    }

    async function submitPublish() {
      const title = document.getElementById('publish-title').value.trim();
      if (!title) return alert("Please give your game a title!");

      const { error } = await db.from('published_games').insert([{
        title: title,
        game_id: currentSavedID,
        author: loggedUser
      }]);

      if (!error) {
        alert(`🚀 '${title}' published to the Community Hub!\nGame ID: ${currentSavedID}`);
        closePublishModal();
        document.getElementById('publish-title').value = '';
      } else {
        alert("Publishing failed: " + error.message);
      }
    }
  </script>
</body>
</html>
